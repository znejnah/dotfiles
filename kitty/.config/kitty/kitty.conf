# --- Typography (Antique Slab/Mono) ---
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0
disable_ligatures never

# --- Window & Rendering ---
# Match Waybar opacity to let the wallpaper bleed through the Obsidian background
background_opacity 0.85
# Inner padding to prevent text from touching the screen edges (tablet aspect)
window_padding_width 12
enable_audio_bell no

# --- Cursor (Sheikah Energy) ---
# Blinking cyan beam, mimicking an ancient terminal prompt
cursor_shape beam
cursor_blink_interval 0.5
cursor_beam_thickness 2.0

# --- Theme Inclusion ---
include royalsheikah.conf
