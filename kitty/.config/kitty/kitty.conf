# -- font config --
# available fonts: $ kitty list-fonts
font_family        JetBrains Mono Nerd Font
font_size          10

# -- window --
window_margin_width 10 15
window_resize_step_cells 5
window_resize_step_lines 2
confirm_os_window_close 1

# -- misc settings --
enable_audio_bell no
force_ltr no
detect_urls yes
