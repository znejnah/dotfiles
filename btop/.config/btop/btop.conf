# Set theme to Royal Sheikah
color_theme = "royal_sheikah"

# If true, uses terminal background instead of theme background
theme_background = false

# Truecolor 24-bit support
truecolor = true

# Update frequency in milliseconds (2000ms = 2s matches Waybar)
update_ms = 2000

# Rounded box corners to match Waybar floating islands
rounded_corners = true

# Graph symbols: "braille", "block", "tty"
graph_symbol = "braille"

# Show temperature sensors and auto-select CPU
check_temp = true
cpu_sensor = "k10temp"

# Layout presets: "cpu:0:default,mem:0:default,net:0:default,proc:0:default"
# Show all 4 panels
show_cpu = true
show_mem = true
show_net = true
show_proc = true

# Process box sorting: "pid", "program", "arguments", "threads", "user", "memory", "cpu lazy", "cpu direct"
proc_sorting = "cpu lazy"
proc_reversed = false
proc_tree = true
proc_colors = true
proc_gradient = true
proc_per_core = true
