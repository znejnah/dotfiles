 add_newline = true
palette = "electrovoid"

format = """\
[╭╴](fg:muted)\
$os\
$username\
$directory\
$git_branch\
$git_status\
$python\
$nodejs\
$rust\
$cmd_duration\
$time
[╰─](fg:muted)$character\
"""

# -----------------------------------------------------------------------------
# PALETTE : ELECTROVOID
# -----------------------------------------------------------------------------
[palettes.electrovoid]
base = "#000000"
text = "#ffffff"
muted = "#555555"
purple = "#8800ff"
purple_light = "#bb00ff"
cyan = "#00e5ff"
green = "#00ff88"
orange = "#ffaa00"
pink = "#ff2fa0"
red = "#ff3b5c"

# -----------------------------------------------------------------------------
# OS & USER (Neon Purple)
# -----------------------------------------------------------------------------
[os]
disabled = false
style = "fg:purple_light bold"
format = "[$symbol]($style)"

[username]
style_user = "fg:purple_light bold"
style_root = "fg:red bold"
format = "[$user]($style) [::](fg:muted) "
show_always = true

[os.symbols]
Arch = " "

# -----------------------------------------------------------------------------
# DIRECTORY (Neon Cyan)
# -----------------------------------------------------------------------------
[directory]
style = "fg:cyan bold"
format = "[  $path]($style) "
truncation_length = 3
truncate_to_repo = true
truncation_symbol = "…/"
read_only = "  "

# -----------------------------------------------------------------------------
# GIT (Acid Green & Orange)
# -----------------------------------------------------------------------------
[git_branch]
style = "fg:purple_light bold"
format = "[ $branch]($style) "

[git_status]
style = "fg:pink bold"
format = '[\[](fg:muted)[ $all_status$ahead_behind ]($style)[\]](fg:muted) '
modified = "[ ](fg:orange bold)"
staged = "[ ](fg:green bold)"
untracked = "[ ](fg:cyan bold)"
deleted = "[ ](fg:red bold)"
renamed = "[󰑕 ](fg:purple_light bold)"
stashed = "[ ](fg:pink bold)"
conflicted = "[ ](fg:red bold)"
ahead = "[ ](fg:cyan bold)"
behind = "[ ](fg:purple_light bold)"
diverged = "[ ](fg:red bold)"

# -----------------------------------------------------------------------------
# LANGUAGES (Neon Pink)
# -----------------------------------------------------------------------------
[python]
style = "fg:pink bold"
format = '[ ${pyenv_prefix}${version}]($style) '

[nodejs]
style = "fg:pink bold"
format = "[ $version]($style) "

[rust]
style = "fg:pink bold"
format = "[ $version]($style) "

# -----------------------------------------------------------------------------
# TOOLS & TIMER (Muted & Purple)
# -----------------------------------------------------------------------------
[cmd_duration]
style = "fg:purple bold"
format = "[ $duration]($style) "
min_time = 500

[time]
disabled = false
time_format = "%H:%M"
style = "fg:muted"
format = "[ $time]($style) "

# -----------------------------------------------------------------------------
# FINAL CHARACTER
# -----------------------------------------------------------------------------
[character]
success_symbol = "[>_](fg:cyan bold)"
error_symbol = "[>_](fg:red bold)"
