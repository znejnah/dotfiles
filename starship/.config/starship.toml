add_newline = true
palette = "royalsheikah"

format = """\
[╭╴](fg:rock)\
$os\
$username\
$directory\
$git_branch\
$git_status\
$python\
$nodejs\
$rust\
$lua\
$cmd_duration\
$time
[╰─](fg:rock)$character\
"""

# ==============================================================================
# PALETTE: ROYAL SHEIKAH
# ==============================================================================
[palettes.royalsheikah]
obsidian = "#1c1c1e"
rock     = "#4e544b"       # Gray/Green stone for passive structures
sheikah  = "#00e5ff"       # Electric Cyan (Ancient glow)
royal    = "#d4af37"       # Triforce Gold (Active, Selection)
ocarina  = "#22c55e"       # 40th Anniversary Green (Success, Additions)
stasis   = "#ff7a00"       # Magmatic Orange (Modifications, alerts)
gloom    = "#e11d48"       # Ruby Red (Errors)


# ==============================================================================
# OS & USER (The Royal Heritage)
# ==============================================================================
[os]
disabled = false
style = "fg:royal bold"
format = "[$symbol]($style)"

[username]
style_user = "fg:royal bold"
style_root = "fg:gloom bold"
format = "[$user]($style) [::](fg:rock) "
show_always = true

[os.symbols]
Arch = " "
Macos = " "


# ==============================================================================
# DIRECTORY (Sheikah Energy)
# ==============================================================================
[directory]
style = "fg:sheikah bold"
format = "[◈  $path]($style) "
truncation_length = 3
truncate_to_repo = true
truncation_symbol = "…/"
read_only = "  "


# ==============================================================================
# GIT (Explicit Sheikah Structure)
# ==============================================================================
[git_branch]
style = "fg:royal bold"
format = "[ $branch]($style) "

[git_status]
style = "fg:sheikah bold"
format = '[\[](fg:rock)[ $all_status$ahead_behind ]($style)[\]](fg:rock) '

# Geometric symbols paired with standard Git text indicators for clarity
modified   = "[⎔ M ](fg:stasis bold)"     # Modified
staged     = "[◈ + ](fg:ocarina bold)"    # Added/Staged
untracked  = "[◇ ? ](fg:stasis bold)"     # Untracked
deleted    = "[ - ](fg:gloom bold)"      # Deleted
renamed    = "[󰑕 R ](fg:sheikah bold)"    # Renamed
stashed    = "[ * ](fg:royal bold)"      # Stashed
conflicted = "[ ! ](fg:gloom bold)"      # Conflicted
ahead      = "[▲ ⇡ ](fg:sheikah bold)"    # Commits ahead
behind     = "[▼ ⇣ ](fg:stasis bold)"     # Commits behind
diverged   = "[⟁ ⇕ ](fg:gloom bold)"      # Diverged branches


# ==============================================================================
# LANGUAGES (Ancient Tools)
# ==============================================================================
[python]
style = "fg:sheikah bold"
format = '[ ${pyenv_prefix}${version}]($style) '

[nodejs]
style = "fg:sheikah bold"
format = "[ $version]($style) "

[rust]
style = "fg:sheikah bold"
format = "[ $version]($style) "

[lua]
style = "fg:sheikah bold"
format = "[ $version]($style) "


# ==============================================================================
# TOOLS & TIMER
# ==============================================================================
[cmd_duration]
style = "fg:stasis bold"
format = "[ $duration]($style) "
min_time = 500

[time]
disabled = false
time_format = "%H:%M"
style = "fg:rock"
format = "[ $time]($style) "


# ==============================================================================
# FINAL CHARACTER (The Prompt)
# ==============================================================================
[character]
success_symbol = "[>_](fg:sheikah bold)"
error_symbol = "[>_](fg:gloom bold)"
