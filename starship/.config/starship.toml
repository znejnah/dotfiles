add_newline = true
palette = "vice"

format = """\
[╭╴](fg:dusk)[󰓎 ](fg:flamingo)[󱁕 ](fg:dusk)\
$username\
$directory\
$git_branch\
$git_status\
$python\
$nodejs\
$rust\
$lua\
$fill\
$cmd_duration\
$time
[╰─](fg:dusk)$character\
"""

# ==============================================================================
# PALETTE: VICE
# ==============================================================================
[palettes.vice]
midnight = "#130f1d"
dusk     = "#3b2d54"       # Violet passive structure
cyan     = "#00f0ff"       # Ocean Drive Cyan glow
flamingo = "#ff2a85"       # Flamingo Neon (User / Active)
palm     = "#00e676"       # Palm Mint (Success / Staged)
sunset   = "#ff9e00"       # Sunset Amber (Warning / Modified)
crimson  = "#ff1744"       # Heatwave Crimson (Errors / Critical)

[fill]
symbol = " "

# ==============================================================================
# OS & USER
# ==============================================================================
[os]
disabled = true
style = "fg:flamingo bold"
format = "[$symbol]($style) [󱁕 ](fg:dusk) "

[os.symbols]
Arch = " "
Macos = " "

[username]
style_user = "fg:flamingo bold"
style_root = "fg:crimson bold"
format = "[$user]($style) [󱁕 ](fg:dusk) "
show_always = false

# ==============================================================================
# DIRECTORY
# ==============================================================================
[directory]
style = "fg:cyan bold"
format = "[$path]($style)[$read_only](fg:crimson) "
truncation_length = 3
truncate_to_repo = true
truncation_symbol = "…/"
read_only = " "

# ==============================================================================
# GIT (Icons Only)
# ==============================================================================
[git_branch]
style = "fg:flamingo bold"
format = "[ $branch]($style) "

[git_status]
style = "fg:cyan bold"
format = '[\[](fg:dusk)[ $all_status$ahead_behind ]($style)[\]](fg:dusk) '

modified   = "[ ](fg:sunset bold)"
staged     = "[ ](fg:palm bold)"
untracked  = "[ ](fg:cyan bold)"
deleted    = "[ ](fg:crimson bold)"
renamed    = "[󰑕 ](fg:flamingo bold)"
stashed    = "[ ](fg:flamingo bold)"
conflicted = "[ ](fg:crimson bold)"
ahead      = "[ ](fg:cyan bold)"
behind     = "[ ](fg:sunset bold)"
diverged   = "[ ](fg:crimson bold)"

# ==============================================================================
# LANGUAGES
# ==============================================================================
[python]
style = "fg:cyan bold"
format = '[ ${pyenv_prefix}${version}]($style) '

[nodejs]
style = "fg:cyan bold"
format = "[ $version]($style) "

[rust]
style = "fg:cyan bold"
format = "[ $version]($style) "

[lua]
style = "fg:cyan bold"
format = "[ $version]($style) "

# ==============================================================================
# TOOLS & TIMER
# ==============================================================================
[cmd_duration]
style = "fg:sunset bold"
format = "[󰔛 $duration]($style) "
min_time = 500

[time]
disabled = false
time_format = "%H:%M"
style = "fg:dusk"
format = "[ $time]($style)"

# ==============================================================================
# FINAL CHARACTER (The Prompt)
# ==============================================================================
[character]
success_symbol = "[>_ ](fg:cyan bold)"
error_symbol = "[>_ ](fg:crimson bold)"
