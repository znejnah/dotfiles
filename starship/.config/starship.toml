# ==============================================================================
# VICE CITY / LEONIDA — STARSHIP PROMPT (RESIZE-SAFE)
# ==============================================================================

add_newline = true
palette = "vice"

format = """\
[╭╴](fg:purple)[󰓎 ](fg:pink)[󱁕 ](fg:purple)\
$username\
$directory\
$git_branch\
$git_status\
$python\
$nodejs\
$rust\
$lua
[╰─](fg:purple)$character\
"""

right_format = """$cmd_duration$time"""

# ==============================================================================
# PALETTE (Abyssal Night & Soft Vapor)
# ==============================================================================
[palettes.vice]
midnight = "#07091B"       # Abyssal Night
surface  = "#0F1436"       # Deep Bay
vapor    = "#D5DDF7"       # Soft Vapor
purple   = "#8C6CFF"       # Neon Purple (Structure / Clock)
cyan     = "#00F0FF"       # Vice Cyan (Paths / Prompt)
pink     = "#FF5CA8"       # Sunset Pink (Active / Git Branch)
peach    = "#FFB86B"       # Miami Peach (Runtimes / Duration / Modified)
palm     = "#00E68A"       # Palm Mint (Staged / Success)
crimson  = "#FF3B6B"       # Coral Heat (Errors / Deleted)

# ==============================================================================
# USER (Shown only on SSH or root)
# ==============================================================================
[os]
disabled = true

[username]
style_user = "fg:pink bold"
style_root = "fg:crimson bold"
format = "[$user]($style) [󱁕 ](fg:purple)"
show_always = false

# ==============================================================================
# DIRECTORY
# ==============================================================================
[directory]
style = "fg:cyan bold"
format = "[$path]($style)[$read_only](fg:crimson) "
truncation_length = 3
truncate_to_repo = true
truncation_symbol = "…/"
read_only = " "

# ==============================================================================
# GIT STATUS (Icons Only)
# ==============================================================================
[git_branch]
style = "fg:pink bold"
format = "[ $branch]($style) "

[git_status]
style = "fg:vapor bold"
format = '[\[](fg:purple)[ $all_status$ahead_behind ]($style)[\]](fg:purple) '

modified   = "[ ](fg:peach bold)"
staged     = "[ ](fg:palm bold)"
untracked  = "[ ](fg:cyan bold)"
deleted    = "[ ](fg:crimson bold)"
renamed    = "[󰑕 ](fg:pink bold)"
stashed    = "[ ](fg:pink bold)"
conflicted = "[ ](fg:crimson bold)"
ahead      = "[ ](fg:cyan bold)"
behind     = "[ ](fg:peach bold)"
diverged   = "[ ](fg:crimson bold)"

# ==============================================================================
# RUNTIMES (Miami Peach)
# ==============================================================================
[python]
style = "fg:peach bold"
format = '[ ${pyenv_prefix}${version}]($style) '

[nodejs]
style = "fg:peach bold"
format = "[ $version]($style) "

[rust]
style = "fg:peach bold"
format = "[ $version]($style) "

[lua]
style = "fg:peach bold"
format = "[ $version]($style) "

# ==============================================================================
# TELEMETRY & CLOCK (Right Prompt)
# ==============================================================================
[cmd_duration]
style = "fg:peach bold"
format = "[󰔛 $duration]($style) "
min_time = 500

[time]
disabled = false
time_format = "%H:%M"
style = "fg:purple"
format = "[ $time]($style)"

# ==============================================================================
# PROMPT CHARACTER
# ==============================================================================
[character]
success_symbol = "[>_ ](fg:cyan bold)"
error_symbol = "[>_ ](fg:crimson bold)"
