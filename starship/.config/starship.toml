add_newline = true
palette = "electrovoid"

format = """\
[╭╴](fg:muted)\
$os\
$username\
$directory\
$git_branch\
$git_status\
$python\
$nodejs\
$rust\
$cmd_duration\
$time
[╰─](fg:muted)$character\
"""

# -----------------------------------------------------------------------------
# PALETTE : ELECTROVOID (Extracted from Zed Theme)
# -----------------------------------------------------------------------------
[palettes.electrovoid]
base = "#000000"         # Black text for high contrast inside bright pills
text = "#ffffff"         # White text
muted = "#555555"        # Gray for connectors/brackets
purple = "#8800ff"       # Primary border/accent
purple_light = "#bb00ff" # Active/Hover accent
cyan = "#00e5ff"         # Info/Functions
green = "#00ff88"        # Success/Strings
orange = "#ffaa00"       # Warnings/Numbers
pink = "#ff2fa0"         # Links/Keywords
red = "#ff3b5c"          # Errors

# -----------------------------------------------------------------------------
# OS & USER (Neon Purple)
# -----------------------------------------------------------------------------
[os]
disabled = false
style = "bg:purple_light fg:base"
format = "[](fg:purple_light)[$symbol]($style)"

[username]
style_user = "bg:purple_light fg:base"
style_root = "bg:red fg:base"
format = "[$user ]($style)[](fg:purple_light) "
show_always = true

[os.symbols]
Arch = " "
Macos = " "

# -----------------------------------------------------------------------------
# DIRECTORY (Neon Cyan)
# -----------------------------------------------------------------------------
[directory]
style = "bg:cyan fg:base"
format = "[](fg:cyan)[  $path ]($style)[](fg:cyan) "
truncation_length = 3
truncate_to_repo = true
truncation_symbol = "…/"
read_only = "  "

# -----------------------------------------------------------------------------
# GIT (Acid Green Branch, Orange Status)
# -----------------------------------------------------------------------------
[git_branch]
style = "bg:green fg:base"
format = "[](fg:green)[ $branch ]($style)[](fg:green) "

[git_status]
style = "bg:orange fg:base"
format = "[](fg:orange)[$all_status$ahead_behind ]($style)[](fg:orange) "
# Explicit Nerd Font Icons
modified = " "
staged = " "
untracked = " "
deleted = " "
renamed = "󰑕 "
stashed = " "
conflicted = " "
ahead = " "
behind = " "
diverged = " "

# -----------------------------------------------------------------------------
# LANGUAGES (Neon Pink)
# -----------------------------------------------------------------------------
[python]
style = "bg:pink fg:base"
format = '[](fg:pink)[ ${pyenv_prefix}(${version} )(\($virtualenv\) )]($style)[](fg:pink) '

[nodejs]
style = "bg:pink fg:base"
format = "[](fg:pink)[ $version ]($style)[](fg:pink) "

[rust]
style = "bg:pink fg:base"
format = "[](fg:pink)[ $version ]($style)[](fg:pink) "

# -----------------------------------------------------------------------------
# TOOLS & TIMER (Dark Purple and Muted Gray)
# -----------------------------------------------------------------------------
[cmd_duration]
style = "bg:purple fg:text"
format = "[](fg:purple)[ $duration ]($style)[](fg:purple) "
min_time = 500

[time]
disabled = false
time_format = "%H:%M"
style = "bg:muted fg:text"
format = "[](fg:muted)[ $time ]($style)[](fg:muted) "

# -----------------------------------------------------------------------------
# FINAL CHARACTER
# -----------------------------------------------------------------------------
[character]
success_symbol = "[❯](fg:purple_light)"
error_symbol = "[❯](fg:red)"
