# ==============================================================================
# BOTTOM CONFIGURATION — VICE CITY / LEONIDA (ABYSSAL NIGHT)
# ==============================================================================

[flags]
rate = "1000ms"
default_time_value = "60s"
time_delta = "15s"
hide_time = false
hide_table_gap = true
dot_marker = false
temperature_type = "c"
mem_as_value = true
enable_gpu_memory = true

[processes]
default_tree = false
default_grouped = true
case_sensitive = false
whole_word = false
regex = false

[memory]
cache_memory = false

# --- Row 1: CPU & Memory / VRAM (30%) ---
[[row]]
  ratio = 30
  [[row.child]]
    ratio = 55
    type = "cpu"
  [[row.child]]
    ratio = 45
    type = "mem"

# --- Row 2: Network, Temperatures & Disks (35%) ---
[[row]]
  ratio = 35
  [[row.child]]
    ratio = 45
    type = "network"
  [[row.child]]
    ratio = 55
    [[row.child.child]]
      ratio = 50
      type = "temp"
    [[row.child.child]]
      ratio = 50
      type = "disk"

# --- Row 3: Full-width Processes (35%) ---
[[row]]
  ratio = 35
  [[row.child]]
    type = "proc"
    default = true

# ==============================================================================
# LEONIDA VICE PALETTE (ABYSSAL NIGHT & SOFT VAPOR)
# ==============================================================================
[styles]
  [styles.cpu]
    all_entry_color = "#00f0ff"
    avg_entry_color = "#ff5ca8"
    cpu_core_colors = [
      "#00f0ff",
      "#00e68a",
      "#ff5ca8",
      "#ffb86b",
      "#8c6cff",
      "#d5ddf7",
      "#ad96ff",
      "#ffd099"
    ]

  [styles.memory]
    ram_color = "#00f0ff"
    cache_color = "#54608f"
    swap_color = "#ffb86b"
    arc_color = "#00e68a"
    gpu_colors = [
      "#ff5ca8",
      "#00e68a",
      "#00f0ff",
      "#ffb86b"
    ]

  [styles.network]
    rx_color = "#00f0ff"
    tx_color = "#ff5ca8"
    rx_total_color = "#70f7ff"
    tx_total_color = "#ff85be"

  [styles.battery]
    high_battery_color = "#00e68a"
    medium_battery_color = "#ffb86b"
    low_battery_color = "#ff3b6b"

  [styles.tables]
    headers = { color = "#ff5ca8", bold = true }

  [styles.graphs]
    graph_color = "#8b96c2"
    legend_text = { color = "#d5ddf7" }

  [styles.widgets]
    border_color = "#2d2861"
    selected_border_color = "#ff5ca8"
    widget_title = { color = "#ff5ca8", bold = true }
    text = { color = "#d5ddf7" }
    selected_text = { color = "#07091b", bg_color = "#00f0ff", bold = true }
    disabled_text = { color = "#54608f" }
