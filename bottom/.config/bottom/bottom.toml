# =========================================================================
# BOTTOM CONFIGURATION - VICE
# =========================================================================

[flags]
rate = "1000ms"
default_time_value = "60s"
time_delta = "15s"
hide_time = false
hide_table_gap = true
dot_marker = false
temperature_type = "c"
mem_as_value = true
enable_gpu_memory = true

[processes]
default_tree = false
default_grouped = true
case_sensitive = false
whole_word = false
regex = false

[memory]
cache_memory = false

# --- Row 1: CPU & Memory / VRAM (30%) ---
[[row]]
  ratio = 30
  [[row.child]]
    ratio = 55
    type = "cpu"
  [[row.child]]
    ratio = 45
    type = "mem"

# --- Row 2: Network, Temperatures & Disks (35%) ---
[[row]]
  ratio = 35
  [[row.child]]
    ratio = 45
    type = "network"
  [[row.child]]
    ratio = 55
    [[row.child.child]]
      ratio = 50
      type = "temp"
    [[row.child.child]]
      ratio = 50
      type = "disk"

# --- Row 3: Full-width Processes (35%) ---
[[row]]
  ratio = 35
  [[row.child]]
    type = "proc"
    default = true

# =========================================================================
# LEONIDA VICE PALETTE
# =========================================================================
[styles]
  [styles.cpu]
    all_entry_color = "#00f0ff"
    avg_entry_color = "#ff2a85"
    cpu_core_colors = [
      "#00f0ff",
      "#00e676",
      "#ff2a85",
      "#ff9e00",
      "#ff1744",
      "#e8e0f5",
      "#7b7ef2",
      "#ffc400"
    ]

  [styles.memory]
    ram_color = "#00f0ff"
    cache_color = "#58467a"
    swap_color = "#ff9e00"
    arc_color = "#00e676"
    gpu_colors = [
      "#ff2a85",
      "#00e676",
      "#00f0ff",
      "#ff9e00"
    ]

  [styles.network]
    rx_color = "#00f0ff"
    tx_color = "#ff2a85"
    rx_total_color = "#66f7ff"
    tx_total_color = "#ff66a8"

  [styles.battery]
    high_battery_color = "#00e676"
    medium_battery_color = "#ff9e00"
    low_battery_color = "#ff1744"

  [styles.tables]
    headers = { color = "#ff2a85", bold = true }

  [styles.graphs]
    graph_color = "#e8e0f5"
    legend_text = { color = "#e8e0f5" }

  [styles.widgets]
    border_color = "#3b2d54"
    selected_border_color = "#ff2a85"
    widget_title = { color = "#ff2a85", bold = true }
    text = { color = "#e8e0f5" }
    selected_text = { color = "#130f1d", bg_color = "#00f0ff", bold = true }
    disabled_text = { color = "#58467a" }
