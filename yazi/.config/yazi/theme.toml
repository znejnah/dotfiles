# ==============================================================================
# File        : theme.toml
# Description : Royal Sheikah color theme for Yazi
# Palette     : Obsidian #1c1c1e | Gold #d4af37 | Cyan #00e5ff | Gray #4e544b
#               Green #22c55e | Stasis Orange #ff7a00 | Gloom Red #e11d48
# ==============================================================================

# : Manager {{{

[mgr]
cwd = { fg = "#00e5ff", bold = true }

# Find
find_keyword  = { fg = "#d4af37", bold = true, italic = true, underline = true }
find_position = { fg = "#00e5ff", bg = "reset", bold = true, italic = true }

# Symlink
symlink_target = { italic = true, fg = "#4e544b" }

# Marker
marker_copied   = { fg = "#22c55e", bg = "#22c55e" }
marker_cut      = { fg = "#e11d48", bg = "#e11d48" }
marker_marked   = { fg = "#00e5ff", bg = "#00e5ff" }
marker_selected = { fg = "#d4af37", bg = "#d4af37" }

# Count badges
count_copied   = { fg = "#1c1c1e", bg = "#22c55e" }
count_cut      = { fg = "#1c1c1e", bg = "#e11d48" }
count_selected = { fg = "#1c1c1e", bg = "#d4af37" }

# Border
border_symbol = "│"
border_style  = { fg = "#4e544b" }

# Syntax highlighting disabled (relies on terminal theme)
syntect_theme = ""

# : }}}

# : Tabs {{{

[tabs]
active   = { fg = "#1c1c1e", bg = "#d4af37", bold = true }
inactive = { fg = "#d4af37", bg = "#1c1c1e" }

sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }

# : }}}

# : Mode {{{

[mode]
normal_main = { fg = "#1c1c1e", bg = "#d4af37", bold = true }
normal_alt  = { fg = "#d4af37", bg = "#1c1c1e" }

select_main = { fg = "#1c1c1e", bg = "#00e5ff", bold = true }
select_alt  = { fg = "#00e5ff", bg = "#1c1c1e" }

unset_main  = { fg = "#1c1c1e", bg = "#ff7a00", bold = true }
unset_alt   = { fg = "#ff7a00", bg = "#1c1c1e" }

# : }}}

# : Indicator of hovered file {{{

[indicator]
parent  = { reversed = true }
current = { reversed = true }
preview = { underline = true }
padding = { open = "", close = "" }

# : }}}

# : Status bar {{{

[status]
overall   = { fg = "#d4af37" }
sep_left  = { open = "", close = "" }
sep_right = { open = "", close = "" }

# Permissions
perm_sep   = { fg = "#4e544b" }
perm_type  = { fg = "#00e5ff" }
perm_read  = { fg = "#d4af37" }
perm_write = { fg = "#ff7a00" }
perm_exec  = { fg = "#22c55e" }

# Progress
progress_label  = { fg = "#1c1c1e", bold = true }
progress_normal = { fg = "#00e5ff", bg = "#4e544b" }
progress_error  = { fg = "#e11d48", bg = "#4e544b" }

# : }}}

# : Pick / Input / Tasks / Which {{{

[pick]
border   = { fg = "#00e5ff" }
active   = { fg = "#d4af37", bold = true }
inactive = {}

[input]
border   = { fg = "#00e5ff" }
title    = { fg = "#d4af37" }
value    = {}
selected = { reversed = true }

[cmp]
border = { fg = "#4e544b" }

[tasks]
border  = { fg = "#4e544b" }
title   = { fg = "#d4af37" }
hovered = { fg = "#00e5ff", underline = true }

[which]
mask            = { bg = "#1c1c1e" }
cand            = { fg = "#22c55e" }
rest            = { fg = "#c0c6ba" }
desc            = { fg = "#00e5ff" }
separator       = "  "
separator_style = { fg = "#4e544b" }

[help]
on      = { fg = "#22c55e" }
run     = { fg = "#00e5ff" }
hovered = { reversed = true, bold = true }
footer  = { fg = "#1c1c1e", bg = "#d4af37" }

[notify]
title_info  = { fg = "#00e5ff" }
title_warn  = { fg = "#ff7a00" }
title_error = { fg = "#e11d48" }

# : }}}

# : File-specific styles {{{

[filetype]
rules = [
# Hidden files and folders in Rock Gray
{ url = ".*/", fg = "#4e544b" },
{ url = ".*",  fg = "#4e544b" },

# Directories in Sheikah Cyan
{ url = "*/",  fg = "#00e5ff" },

# Media in Royal Gold
{ mime = "image/*",         fg = "#d4af37" },
{ mime = "{audio,video}/*", fg = "#d4af37" },

# Archives in Gloom Red
{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#e11d48" },

# Documents in Sheikah Sand
{ mime = "application/{doc,pdf,rtf}", fg = "#c0c6ba" },

# Special and executable files
{ url = "*", is = "orphan", bg = "#e11d48" },
{ url = "*", is = "exec",   fg = "#22c55e" },

# Fallback for regular files
{ url = "*", fg = "#c0c6ba" },
]

# : }}}

# : Icons {{{

[icon]
conds = [
# Hidden files and folders
{ if = "hidden & dir", text = "", fg = "#4e544b" },
{ if = "hidden",       text = "", fg = "#4e544b" },

# Standard directories & files
{ if = "dir & hovered", text = "", fg = "#00e5ff" },
{ if = "dir",           text = "", fg = "#00e5ff" },
{ if = "!dir",          text = "", fg = "#c0c6ba" },
]

# : }}}
