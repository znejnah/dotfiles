# ==============================================================================
# VICE CITY / LEONIDA — YAZI THEME (ABYSSAL NIGHT & SOFT VAPOR)
# ==============================================================================

# : Manager {{{

[mgr]
cwd = { fg = "#00f0ff", bold = true }

# Find
find_keyword  = { fg = "#ff5ca8", bold = true, italic = true, underline = true }
find_position = { fg = "#00f0ff", bg = "reset", bold = true, italic = true }

# Symlink
symlink_target = { italic = true, fg = "#54608f" }

# Marker
marker_copied   = { fg = "#00e68a", bg = "#00e68a" }
marker_cut      = { fg = "#ff3b6b", bg = "#ff3b6b" }
marker_marked   = { fg = "#00f0ff", bg = "#00f0ff" }
marker_selected = { fg = "#ff5ca8", bg = "#ff5ca8" }

# Count badges
count_copied   = { fg = "#07091b", bg = "#00e68a" }
count_cut      = { fg = "#07091b", bg = "#ff3b6b" }
count_selected = { fg = "#07091b", bg = "#ff5ca8" }

# Border
border_symbol = "│"
border_style  = { fg = "#2d2861" }

# Syntax highlighting disabled (relies on terminal theme)
syntect_theme = ""

# : }}}

# : Tabs {{{

[tabs]
active   = { fg = "#07091b", bg = "#ff5ca8", bold = true }
inactive = { fg = "#ff5ca8", bg = "#07091b" }

sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }

# : }}}

# : Mode {{{

[mode]
normal_main = { fg = "#07091b", bg = "#ff5ca8", bold = true }
normal_alt  = { fg = "#ff5ca8", bg = "#07091b" }

select_main = { fg = "#07091b", bg = "#00f0ff", bold = true }
select_alt  = { fg = "#00f0ff", bg = "#07091b" }

unset_main  = { fg = "#07091b", bg = "#ffb86b", bold = true }
unset_alt   = { fg = "#ffb86b", bg = "#07091b" }

# : }}}

# : Indicator of hovered file {{{

[indicator]
parent  = { reversed = true }
current = { reversed = true }
preview = { underline = true }
padding = { open = "", close = "" }

# : }}}

# : Status bar {{{

[status]
overall   = { fg = "#ff5ca8" }
sep_left  = { open = "", close = "" }
sep_right = { open = "", close = "" }

# Permissions
perm_sep   = { fg = "#2d2861" }
perm_type  = { fg = "#00f0ff" }
perm_read  = { fg = "#ff5ca8" }
perm_write = { fg = "#ffb86b" }
perm_exec  = { fg = "#00e68a" }

# Progress
progress_label  = { fg = "#07091b", bold = true }
progress_normal = { fg = "#00f0ff", bg = "#2d2861" }
progress_error  = { fg = "#ff3b6b", bg = "#2d2861" }

# : }}}

# : Pick / Input / Tasks / Which {{{

[pick]
border   = { fg = "#00f0ff" }
active   = { fg = "#ff5ca8", bold = true }
inactive = {}

[input]
border   = { fg = "#00f0ff" }
title    = { fg = "#ff5ca8" }
value    = {}
selected = { reversed = true }

[cmp]
border = { fg = "#2d2861" }

[tasks]
border  = { fg = "#2d2861" }
title   = { fg = "#ff5ca8" }
hovered = { fg = "#00f0ff", underline = true }

[which]
mask            = { bg = "#07091b" }
cand            = { fg = "#00e68a" }
rest            = { fg = "#d5ddf7" }
desc            = { fg = "#00f0ff" }
separator       = "  "
separator_style = { fg = "#2d2861" }

[help]
on      = { fg = "#00e68a" }
run     = { fg = "#00f0ff" }
hovered = { reversed = true, bold = true }
footer  = { fg = "#07091b", bg = "#ff5ca8" }

[notify]
title_info  = { fg = "#00f0ff" }
title_warn  = { fg = "#ffb86b" }
title_error = { fg = "#ff3b6b" }

# : }}}

# : File-specific styles {{{

[filetype]
rules = [
  # Hidden files and folders in Muted Indigo
  { url = ".*/", fg = "#54608f" },
  { url = ".*",  fg = "#54608f" },

  # Directories in Vice Cyan
  { url = "*/",  fg = "#00f0ff" },

  # Media in Sunset Pink
  { mime = "image/*",         fg = "#ff5ca8" },
  { mime = "{audio,video}/*", fg = "#ff5ca8" },

  # Archives in Coral Heat
  { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#ff3b6b" },

  # Documents in Soft Vapor
  { mime = "application/{doc,pdf,rtf}", fg = "#d5ddf7" },

  # Special and executable files
  { url = "*", is = "orphan", bg = "#ff3b6b" },
  { url = "*", is = "exec",   fg = "#00e68a" },

  # Fallback for regular files
  { url = "*", fg = "#d5ddf7" },
]

# : }}}

# : Icons {{{

[icon]
conds = [
  # Hidden files and folders
  { if = "hidden & dir", text = "", fg = "#54608f" },
  { if = "hidden",       text = "", fg = "#54608f" },

  # Standard directories & files
  { if = "dir & hovered", text = "", fg = "#00f0ff" },
  { if = "dir",           text = "", fg = "#00f0ff" },
  { if = "!dir",          text = "", fg = "#d5ddf7" },
]

# : }}}
