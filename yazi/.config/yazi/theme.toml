# : Manager {{{

[mgr]
cwd = { fg = "#00f0ff", bold = true }

# Find
find_keyword  = { fg = "#ff2a85", bold = true, italic = true, underline = true }
find_position = { fg = "#00f0ff", bg = "reset", bold = true, italic = true }

# Symlink
symlink_target = { italic = true, fg = "#58467a" }

# Marker
marker_copied   = { fg = "#00e676", bg = "#00e676" }
marker_cut      = { fg = "#ff1744", bg = "#ff1744" }
marker_marked   = { fg = "#00f0ff", bg = "#00f0ff" }
marker_selected = { fg = "#ff2a85", bg = "#ff2a85" }

# Count badges
count_copied   = { fg = "#130f1d", bg = "#00e676" }
count_cut      = { fg = "#130f1d", bg = "#ff1744" }
count_selected = { fg = "#130f1d", bg = "#ff2a85" }

# Border
border_symbol = "│"
border_style  = { fg = "#3b2d54" }

# Syntax highlighting disabled (relies on terminal theme)
syntect_theme = ""

# : }}}

# : Tabs {{{

[tabs]
active   = { fg = "#130f1d", bg = "#ff2a85", bold = true }
inactive = { fg = "#ff2a85", bg = "#130f1d" }

sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }

# : }}}

# : Mode {{{

[mode]
normal_main = { fg = "#130f1d", bg = "#ff2a85", bold = true }
normal_alt  = { fg = "#ff2a85", bg = "#130f1d" }

select_main = { fg = "#130f1d", bg = "#00f0ff", bold = true }
select_alt  = { fg = "#00f0ff", bg = "#130f1d" }

unset_main  = { fg = "#130f1d", bg = "#ff9e00", bold = true }
unset_alt   = { fg = "#ff9e00", bg = "#130f1d" }

# : }}}

# : Indicator of hovered file {{{

[indicator]
parent  = { reversed = true }
current = { reversed = true }
preview = { underline = true }
padding = { open = "", close = "" }

# : }}}

# : Status bar {{{

[status]
overall   = { fg = "#ff2a85" }
sep_left  = { open = "", close = "" }
sep_right = { open = "", close = "" }

# Permissions
perm_sep   = { fg = "#3b2d54" }
perm_type  = { fg = "#00f0ff" }
perm_read  = { fg = "#ff2a85" }
perm_write = { fg = "#ff9e00" }
perm_exec  = { fg = "#00e676" }

# Progress
progress_label  = { fg = "#130f1d", bold = true }
progress_normal = { fg = "#00f0ff", bg = "#3b2d54" }
progress_error  = { fg = "#ff1744", bg = "#3b2d54" }

# : }}}

# : Pick / Input / Tasks / Which {{{

[pick]
border   = { fg = "#00f0ff" }
active   = { fg = "#ff2a85", bold = true }
inactive = {}

[input]
border   = { fg = "#00f0ff" }
title    = { fg = "#ff2a85" }
value    = {}
selected = { reversed = true }

[cmp]
border = { fg = "#3b2d54" }

[tasks]
border  = { fg = "#3b2d54" }
title   = { fg = "#ff2a85" }
hovered = { fg = "#00f0ff", underline = true }

[which]
mask            = { bg = "#130f1d" }
cand            = { fg = "#00e676" }
rest            = { fg = "#e8e0f5" }
desc            = { fg = "#00f0ff" }
separator       = "  "
separator_style = { fg = "#3b2d54" }

[help]
on      = { fg = "#00e676" }
run     = { fg = "#00f0ff" }
hovered = { reversed = true, bold = true }
footer  = { fg = "#130f1d", bg = "#ff2a85" }

[notify]
title_info  = { fg = "#00f0ff" }
title_warn  = { fg = "#ff9e00" }
title_error = { fg = "#ff1744" }

# : }}}

# : File-specific styles {{{

[filetype]
rules = [
# Hidden files and folders in Dusk Violet
{ url = ".*/", fg = "#58467a" },
{ url = ".*",  fg = "#58467a" },

# Directories in Ocean Drive Cyan
{ url = "*/",  fg = "#00f0ff" },

# Media in Flamingo Neon
{ mime = "image/*",         fg = "#ff2a85" },
{ mime = "{audio,video}/*", fg = "#ff2a85" },

# Archives in Heatwave Crimson
{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#ff1744" },

# Documents in Vapor Mist
{ mime = "application/{doc,pdf,rtf}", fg = "#e8e0f5" },

# Special and executable files
{ url = "*", is = "orphan", bg = "#ff1744" },
{ url = "*", is = "exec",   fg = "#00e676" },

# Fallback for regular files
{ url = "*", fg = "#e8e0f5" },
]

# : }}}

# : Icons {{{

[icon]
conds = [
# Hidden files and folders
{ if = "hidden & dir", text = "", fg = "#58467a" },
{ if = "hidden",       text = "", fg = "#58467a" },

# Standard directories & files
{ if = "dir & hovered", text = "", fg = "#00f0ff" },
{ if = "dir",           text = "", fg = "#00f0ff" },
{ if = "!dir",          text = "", fg = "#e8e0f5" },
]

# : }}}
