[general]
fullscreen = false
early-exit = true
initial-tool = "arrow"
copy-command = "wl-copy"
annotation-size-factor = 1
output-filename = "~/Pictures/Screenshots/satty-%Y%m%d-%H%M%S.png"
save-after-copy = false
default-hide-toolbars = false
focus-toggles-toolbars = true
disable-notifications = false

[font]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[color-palette]
palette = [
  "#ff2a85", # Flamingo Neon
  "#00f0ff", # Ocean Drive Cyan
  "#00e676", # Palm Mint
  "#ff9e00", # Sunset Amber
  "#ff1744", # Heatwave Crimson
  "#e8e0f5", # Vapor Mist
]
