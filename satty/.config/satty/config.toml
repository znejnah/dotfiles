# ==============================================================================
# VICE CITY / LEONIDA — SATTY SCREENSHOT ANNOTATION (ABYSSAL NIGHT)
# ==============================================================================

[general]
# Start Satty in fullscreen and copy to clipboard on save/Enter
fullscreen = true
early-exit = true
initial-tool = "brush"
copy-command = "wl-copy"
annotation-size-factor = 1.5
save-after-copy = false
default-hide-toolbars = false
primary-highlighter = "block"
disable-notifications = false

[font]
family = "JetBrains Mono"
style = "Bold"

[color-palette]
# Vice City / Leonida neon annotation swatches
palette = [
  "#ff5ca8", # Sunset Pink
  "#00f0ff", # Vice Cyan
  "#ffb86b", # Miami Peach
  "#8c6cff", # Neon Purple
  "#00e68a", # Palm Mint
  "#ff3b6b", # Coral Heat
  "#d5ddf7", # Soft Vapor
]
