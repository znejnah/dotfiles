# ==============================================================================
# VICE CITY / LEONIDA — HYPRLOCK CONFIGURATION (ABYSSAL NIGHT)
# ==============================================================================

general {
    hide_cursor = true
    ignore_empty_input = true
    immediate_render = true
}

# Fixed Vice City wallpaper with subtle blur and dimming
background {
    monitor =
    path = ~/.config/hypr/wallpapers/vi.png
    color = rgba(7, 9, 27, 1.0)
    blur_passes = 2
    blur_size = 5
    noise = 0.012
    contrast = 0.95
    brightness = 0.75
    reload_time = -1
}

# Clock (Hours in Vice Cyan)
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(0, 240, 255, 0.95)
    font_size = 84
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 140
    halign = center
    valign = center
}

# Date (Soft Vapor)
label {
    monitor =
    text = cmd[update:60000] echo "$(date +"%A %d %B")"
    color = rgba(213, 221, 247, 0.80)
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = 0, 65
    halign = center
    valign = center
}

# Password Input Field
input-field {
    monitor =
    size = 280, 48
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.30
    dots_center = true
    outer_color = rgba(255, 92, 168, 0.90)      # Sunset Pink
    inner_color = rgba(7, 9, 27, 0.88)         # Abyssal Night
    font_color = rgba(213, 221, 247, 1.0)      # Soft Vapor
    fade_on_empty = false
    placeholder_text = <span foreground="##8c6cff">󰌾  Leonida Access</span>
    hide_input = false
    rounding = 10
    check_color = rgba(0, 240, 255, 0.95)      # Vice Cyan (verifying)
    fail_color = rgba(255, 59, 107, 0.95)      # Coral Heat (wrong password)
    fail_text = <i>$FAIL ($ATTEMPTS)</i>
    capslock_color = rgba(255, 184, 107, 0.95) # Miami Peach (Caps Lock warning)
    position = 0, -40
    halign = center
    valign = center
}

# Caps Lock active warning below the input field
label {
    monitor =
    text = cmd[update:500] [ "$(cat /sys/class/leds/*::capslock/brightness 2>/dev/null | head -n1)" = "1" ] && echo "󰪛  CAPS LOCK ACTIVE" || echo ""
    color = rgba(255, 184, 107, 0.95)
    font_size = 12
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, -95
    halign = center
    valign = center
}
