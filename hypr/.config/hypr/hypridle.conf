# ==============================================================================
# VICE CITY / LEONIDA — HYPRIDLE CONFIGURATION
# ==============================================================================

general {
    # Avoid launching multiple hyprlock instances
    lock_cmd = pidof hyprlock || hyprlock
    # Lock screen automatically before sleep
    before_sleep_cmd = loginctl lock-session
    # Turn displays back on immediately after wake
    after_sleep_cmd = hyprctl dispatch dpms on
}

# 1. Lock screen after 10 minutes (600s) of inactivity
listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

# 2. Turn off displays after 15 minutes (900s) of inactivity
listener {
    timeout = 900
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}
